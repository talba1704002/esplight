name: Build ESP32 Matter Light

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  IDF_VERSION: v5.2.3
  MATTER_BRANCH: release/v1.4

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate ESP-IDF project folder
        run: |
          CMAKE_FILE=$(grep -rl --include=CMakeLists.txt "tools/cmake/project.cmake" "$GITHUB_WORKSPACE" \
            | grep -v "/build/" | head -n 1)
          if [ -z "$CMAKE_FILE" ]; then
            echo "ERROR: no top-level CMakeLists.txt with project.cmake found. Repo contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -not -path '*/.git/*'
            exit 1
          fi
          PROJECT_PATH=$(dirname "$CMAKE_FILE")
          echo "Project folder: $PROJECT_PATH"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          ls -la "$PROJECT_PATH"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 pkg-config libglib2.0-dev libdbus-1-dev \
            libgirepository1.0-dev libcairo2-dev libsdl2-dev

      - name: Install ESP-IDF
        run: |
          git clone -b "$IDF_VERSION" --depth 1 --recursive --shallow-submodules \
            https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          cd "$HOME/esp-idf"
          ./install.sh esp32

      - name: Install ESP-Matter
        run: |
          git clone -b "$MATTER_BRANCH" --depth 1 \
            https://github.com/espressif/esp-matter.git "$HOME/esp-matter"
          cd "$HOME/esp-matter"
          git submodule update --init --depth 1
          cd connectedhomeip/connectedhomeip
          ./scripts/checkout_submodules.py --shallow --platform esp32 linux
          cd ../..
          ./install.sh

      - name: Build firmware
        run: |
          # esp-matter install upgrades cryptography; IDF 5.2 needs <42
          "$HOME/.espressif/python_env/idf5.2_py3.12_env/bin/python" \
            -m pip install "cryptography>=2.1.4,<42"

          . "$HOME/esp-idf/export.sh"
          . "$HOME/esp-matter/export.sh"

          cd "$PROJECT_PATH"
          rm -f sdkconfig
          idf.py set-target esp32
          idf.py build

          cd build
          esptool.py --chip esp32 merge_bin -o merged-flash.bin @flash_args
          ls -l *.bin bootloader/*.bin partition_table/*.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-matter-light-firmware
          path: |
            ${{ env.PROJECT_PATH }}/build/merged-flash.bin
            ${{ env.PROJECT_PATH }}/build/bootloader/bootloader.bin
            ${{ env.PROJECT_PATH }}/build/partition_table/partition-table.bin
            ${{ env.PROJECT_PATH }}/build/*.bin
